services:
  hanafudakan:
    build:
      context: .
    image: hanafudakan:local
    restart: unless-stopped
    ports:
      - "${HANAFUDA_HOST:-127.0.0.1}:${HANAFUDA_PORT:-3000}:3000"
    environment:
      BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: ${RUST_LOG:-info}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
